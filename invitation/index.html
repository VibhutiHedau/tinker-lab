<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aarav & Meera | Wedding Invitation</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
 font-family:Georgia,serif; background:#f6ead8 url("wedding-bg.jpg") center/cover fixed no-repeat;
 color:#5a3d2b; padding:25px;
}
.card{
 width:min(900px,95vw); min-height:650px; padding:55px 35px;
 background:rgba(255,250,243,.92); border:3px solid #b88961; border-radius:28px;
 text-align:center; box-shadow:0 18px 50px rgba(70,45,25,.28);
}
.inner{border:1px solid #d8b894;border-radius:22px;padding:45px 25px}
.top{font:600 16px/1.4 Arial,sans-serif;letter-spacing:5px;color:#8b6f47}
h1{font-size:48px;font-weight:400;color:#7a4f36;margin:20px 0 35px}
.names{font-size:36px;font-weight:bold;letter-spacing:2px;color:#6b4531}
.and{font-size:30px;color:#b88961;margin:12px}
.line{width:55%;border-top:2px solid #d8b894;margin:28px auto}
.info{font-family:Arial,sans-serif;letter-spacing:2px;font-size:16px;line-height:1.9;color:#8b6f47}
.venue{font-size:21px;font-weight:bold;color:#6b4531}
.quote{font-style:italic;font-size:18px;color:#8b6f47;margin-top:35px}
@media(max-width:600px){
 .card{padding:25px 15px}.inner{padding:30px 12px}
 h1{font-size:34px}.names{font-size:27px}.top{font-size:12px;letter-spacing:3px}
}
</style>
</head>
<body>
<div class="card">
<div class="inner">
<div class="top">TOGETHER WITH THEIR FAMILIES</div>
<h1>A Wedding Celebration</h1>
<div class="names">AARAV SHARMA</div>
<div class="and">&amp;</div>
<div class="names">MEERA KAPOOR</div>
<div class="line"></div>
<div class="info">
<b>SATURDAY • 20 DECEMBER 2026</b><br>
6:30 PM ONWARDS
</div>
<div style="height:20px"></div>
<div class="venue">THE ROYAL ORCHID GARDEN</div>
<div class="info">NAGPUR • MAHARASHTRA</div>
<div class="quote">With love, laughter &amp; a lifetime to begin ♡</div>
</div>
</div>
</body>
</html>
